<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-MAM 7-Page Export/Import Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; background-color: #f3f4f6; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; background: white; margin-bottom: 20px; }
        th, td { border: 1.5px solid black; padding: 4px; text-align: center; font-size: 11px; }
        th { background-color: #f1f5f9; font-weight: bold; }
        @media print {
            .no-print { display: none !important; }
            .page-break { display: block !important; page-break-after: always !important; margin: 0 !important; padding: 10mm !important; }
            @page { size: A4 landscape; margin: 0; }
        }
        .input-card { background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; border-t-4 border-indigo-700; }
        label { font-weight: bold; color: #1e293b; display: block; margin-top: 8px; font-size: 13px; }
        input, select { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin-top: 3px; }
    </style>
</head>
<body class="pb-10">

    <div class="no-print bg-indigo-900 p-4 text-white sticky top-0 z-50 flex flex-wrap justify-between items-center gap-2 shadow-lg">
        <h1 class="font-bold text-lg">C-MAM ડેટા સેન્ટર</h1>
        <div class="flex flex-wrap gap-2">
            <button onclick="exportData()" class="bg-blue-600 px-3 py-1 rounded text-xs font-bold shadow hover:bg-blue-700">EXPORT (Backup)</button>
            <label class="bg-orange-600 px-3 py-1 rounded text-xs font-bold shadow cursor-pointer hover:bg-orange-700">
                IMPORT <input type="file" id="importFile" class="hidden" onchange="importData(event)">
            </label>
            <button onclick="window.print()" class="bg-green-600 px-4 py-1 rounded text-xs font-bold shadow hover:bg-green-700">PRINT (7 Page)</button>
        </div>
    </div>

    <div class="no-print p-4 max-w-4xl mx-auto">
        <div class="input-card">
            <h2 class="text-center text-lg font-bold text-indigo-800 mb-4 border-b pb-2">બાળકની માહિતી ભરો (ક્રમ ૧-૧૭)</h2>
            <select id="childIdx" onchange="loadChildData()" class="bg-blue-50 font-bold border-indigo-300"></select>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4">
                <div><label>બાળકનું નામ</label><input type="text" id="cName"></div>
                <div><label>માતાનું નામ</label><input type="text" id="mName"></div>
                <div><label>મહિનો</label><input type="text" id="cMonth" placeholder="MM-YYYY"></div>
                <div><label>ઉંમર</label><input type="number" id="cAge"></div>
                <div><label>વજન</label><input type="number" step="0.1" id="cWeight"></div>
                <div><label>ઊંચાઈ</label><input type="number" step="0.1" id="cHeight"></div>
            </div>
            
            <button onclick="saveData()" class="w-full bg-indigo-700 text-white py-3 rounded-xl font-bold mt-6 hover:bg-indigo-800 transition">માહિતી સેવ કરો</button>
        </div>
    </div>

    <div id="printArea" class="p-4 print:p-0">
        <div class="page-break bg-white p-4 mb-6 shadow">
            <h3 class="text-center font-bold mb-2">પાનું ૧: સ્ક્રિનિંગ ડેટા (Screening)</h3>
            <table><thead><tr><th class="w-10">ક્રમ</th><th class="w-24">મહિનો</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th class="w-12">ઉંમર</th><th class="w-12">વજન</th><th class="w-12">ઊંચાઈ</th></tr></thead><tbody id="b1"></tbody></table>
        </div>
        <div class="page-break bg-white p-4 mb-6 shadow">
            <h3 class="text-center font-bold mb-2">પાનું ૨: તબીબી મૂલ્યાંકન (Medical)</h3>
            <table><thead><tr><th class="w-10">ક્રમ</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th>તબીબી જટિલતાઓ</th></tr></thead><tbody id="b2"></tbody></table>
        </div>
        </div>

    <script>
        const total = 17;
        let db = JSON.parse(localStorage.getItem('cmam_v8_final')) || {};

        function setup() {
            const sel = document.getElementById('childIdx');
            const b1 = document.getElementById('b1');
            const b2 = document.getElementById('b2');

            for (let i = 1; i <= total; i++) {
                sel.innerHTML += `<option value="${i}">બાળક ક્રમ - ${i}</option>`;
                b1.innerHTML += `<tr><td>${i}</td><td id="m1-${i}"></td><td id="cn1-${i}"></td><td id="mn1-${i}"></td><td id="a1-${i}"></td><td id="w1-${i}"></td><td id="h1-${i}"></td></tr>`;
                b2.innerHTML += `<tr><td>${i}</td><td id="cn2-${i}"></td><td id="mn2-${i}"></td><td></td></tr>`;
            }
            refresh();
            loadChildData();
        }

        function saveData() {
            const i = document.getElementById('childIdx').value;
            db[i] = {
                name: document.getElementById('cName').value,
                mname: document.getElementById('mName').value,
                month: document.getElementById('cMonth').value,
                age: document.getElementById('cAge').value,
                weight: document.getElementById('cWeight').value,
                height: document.getElementById('cHeight').value
            };
            localStorage.setItem('cmam_v8_final', JSON.stringify(db));
            refresh();
            alert("ડેટા સેવ થયો!");
        }

        function loadChildData() {
            const i = document.getElementById('childIdx').value;
            const d = db[i] || {};
            document.getElementById('cName').value = d.name || '';
            document.getElementById('mName').value = d.mname || '';
            document.getElementById('cMonth').value = d.month || '';
            document.getElementById('cAge').value = d.age || '';
            document.getElementById('cWeight').value = d.weight || '';
            document.getElementById('cHeight').value = d.height || '';
        }

        function refresh() {
            for (let i = 1; i <= total; i++) {
                const d = db[i];
                if (d) {
                    ['1','2'].forEach(p => {
                        const cn = document.getElementById(`cn${p}-${i}`); if(cn) cn.innerText = d.name;
                        const mn = document.getElementById(`mn${p}-${i}`); if(mn) mn.innerText = d.mname;
                    });
                    if(document.getElementById(`m1-${i}`)) document.getElementById(`m1-${i}`).innerText = d.month;
                    if(document.getElementById(`a1-${i}`)) document.getElementById(`a1-${i}`).innerText = d.age;
                    if(document.getElementById(`w1-${i}`)) document.getElementById(`w1-${i}`).innerText = d.weight;
                    if(document.getElementById(`h1-${i}`)) document.getElementById(`h1-${i}`).innerText = d.height;
                }
            }
        }

        // Export Function
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "C-MAM_Backup_" + new Date().toLocaleDateString() + ".json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        // Import Function
        function importData(event) {
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    db = JSON.parse(e.target.result);
                    localStorage.setItem('cmam_v8_final', JSON.stringify(db));
                    refresh();
                    loadChildData();
                    alert("ડેટા સફળતાપૂર્વક ઇમ્પોર્ટ થયો છે!");
                } catch (err) {
                    alert("ફાઈલ વાંચવામાં ભૂલ છે!");
                }
            };
            reader.readAsText(event.target.files[0]);
        }

        setup();
    </script>
</body>
</html>
