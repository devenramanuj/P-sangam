<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - ફાઈનલ એડવાન્સ એપ</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .month-year-container { background: #ffffff; padding: 15px; text-align: center; border-bottom: 3px solid #e67e22; }
        .styled-select { padding: 10px; font-size: 16px; font-weight: bold; color: #000 !important; background: #fff !important; border: 2px solid #d35400; border-radius: 8px; margin: 5px; width: 140px; }
        .nav-tabs { display: flex; overflow-x: auto; background: white; border-bottom: 2px solid #e67e22; position: sticky; top: 0; z-index: 100; }
        .tab-btn { padding: 12px; border: none; background: none; cursor: pointer; font-weight: bold; color: #555; white-space: nowrap; flex: 1; min-width: 70px; }
        .tab-btn.active { color: #e67e22; background: #fff5eb; border-bottom: 4px solid #e67e22; }
        .container { padding: 15px; }
        .page { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-bottom: 20px; }
        .page.active { display: block; }
        .action-bar { margin-bottom: 15px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 12px; }
        .btn-print { background: #34495e; }
        .btn-wa { background: #27ae60; }
        .btn-export { background: #2980b9; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 1200px; table-layout: fixed; }
        table, th, td { border: 1px solid #bdc3c7; }
        th { background: #ecf0f1; padding: 8px; }
        input, select { width: 100%; border: none; padding: 8px; text-align: center; font-size: 13px; color: #000; background: transparent; }
        @media print { 
            .nav-tabs, .action-bar, .month-year-container, .header { display: none !important; } 
            .page { display: block !important; box-shadow: none; border: 1px solid #000; page-break-after: always; visibility: visible !important; }
            body { background: white; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="header">પોષણ સંગમ - સંપૂર્ણ રજિસ્ટર</div>

<div class="month-year-container">
    <select id="selectedMonth" class="styled-select" onchange="changeMonth()">
        <option value="1">જાન્યુઆરી</option><option value="2">ફેબ્રુઆરી</option><option value="3">માર્ચ</option>
        <option value="4">એપ્રિલ</option><option value="5">મે</option><option value="6">જૂન</option>
        <option value="7">જુલાઈ</option><option value="8">ઓગસ્ટ</option><option value="9">સપ્ટેમ્બર</option>
        <option value="10">ઓક્ટોબર</option><option value="11">નવેમ્બર</option><option value="12">ડિસેમ્બર</option>
    </select>
    <select id="selectedYear" class="styled-select" onchange="changeMonth()">
        <option value="2025">2025</option><option value="2026">2026</option>
    </select>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="go(1)">P-1</button><button class="tab-btn" onclick="go(2)">P-2</button><button class="tab-btn" onclick="go(3)">P-3</button><button class="tab-btn" onclick="go(4)">P-4</button><button class="tab-btn" onclick="go(5)">P-5</button><button class="tab-btn" onclick="go(6)">P-6</button><button class="tab-btn" onclick="go(7)">P-7</button>
</div>

<div class="container">
    <div class="action-bar">
        <button class="btn btn-print" onclick="fullPrint()">🖨️ ૧ થી ૭ પેજ પ્રિન્ટ</button>
        <button class="btn btn-wa" onclick="shareWhatsApp()">💬 ડેટા WhatsApp શેર</button>
        <button class="btn btn-export" onclick="exportData()">📤 Export</button>
    </div>

    <div id="p1" class="page active">
        <h3>Page 1: Screening Data</h3>
        <table>
            <tr><th>ક્રમ</th><th style="width:200px;">બાળકનું નામ</th><th>માતાનું નામ</th><th>જન્મ તારીખ</th><th>સ્તર</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input type="text" id="p1_name_${i}" oninput="saveData()"></td><td><input type="text" id="p1_mom_${i}" oninput="saveData()"></td><td><input type="date" id="p1_dob_${i}" oninput="saveData()"></td><td><input type="text" id="p1_lvl_${i}" oninput="saveData()"></td></tr>`);</script>
        </table>
    </div>

    <div id="p2" class="page">
        <h3>Page 2: Medical Assessment</h3>
        <table>
            <tr><th>ક્રમ</th><th>ભૂખ પરીક્ષણ</th><th>તારીખ</th><th>જટિલતા</th><th>રેફરલ</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input type="text" id="p2_a_${i}" oninput="saveData()"></td><td><input type="date" id="p2_b_${i}" oninput="saveData()"></td><td><input type="text" id="p2_c_${i}" oninput="saveData()"></td><td><input type="text" id="p2_d_${i}" oninput="saveData()"></td></tr>`);</script>
        </table>
    </div>

    <div id="p3" class="page"><h3>Page 3: Medicines</h3><table id="t3"></table></div>
    <div id="p4" class="page"><h3>Page 4: Follow Up</h3><table id="t4"></table></div>
    <div id="p5" class="page"><h3>Page 5: Final Grading</h3><table id="t5"></table></div>
    <div id="p6" class="page"><h3>Page 6: Discharge</h3><table id="t6"></table></div>
    <div id="p7" class="page"><h3>Page 7: Post Discharge</h3><table id="t7"></table></div>
</div>

<script>
    let currentKey = "";
    function initApp() { 
        const d = new Date(); 
        document.getElementById('selectedMonth').value = d.getMonth() + 1; 
        document.getElementById('selectedYear').value = d.getFullYear(); 
        // પેજ ૩-૭ ના ટેબલ ઓટો જનરેટ કરવા માટે
        [3,4,5,6,7].forEach(p => {
            let html = "<tr><th>ક્રમ</th><th>વિગત 1</th><th>વિગત 2</th><th>વિગત 3</th></tr>";
            for(let i=1; i<=15; i++) html += `<tr><td>${i}</td><td><input id="p${p}_x_${i}" oninput="saveData()"></td><td><input id="p${p}_y_${i}" oninput="saveData()"></td><td><input id="p${p}_z_${i}" oninput="saveData()"></td></tr>`;
            document.getElementById('t'+p).innerHTML = html;
        });
        changeMonth(); 
    }
    function changeMonth() { currentKey = `poshan_${document.getElementById('selectedMonth').value}_${document.getElementById('selectedYear').value}`; loadData(); }
    function go(n) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('p' + n).classList.add('active'); document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i+1===n)); }
    function saveData() { const d = {}; document.querySelectorAll('input').forEach(i => { if(i.id) d[i.id] = i.value; }); localStorage.setItem(currentKey, JSON.stringify(d)); }
    function loadData() { document.querySelectorAll('input').forEach(i => i.value = ""); const s = localStorage.getItem(currentKey); if(s){ const d = JSON.parse(s); for(const k in d) if(document.getElementById(k)) document.getElementById(k).value = d[k]; } }
    
    function fullPrint() { window.print(); }

    function shareWhatsApp() {
        let msg = `*પોષણ સંગમ રિપોર્ટ (${document.getElementById('selectedMonth').value}-${document.getElementById('selectedYear').value})*\n\n`;
        for(let i=1; i<=15; i++) {
            let name = document.getElementById(`p1_name_${i}`).value;
            if(name) msg += `${i}. ${name} - ${document.getElementById(`p1_lvl_${i}`).value}\n`;
        }
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }

    function exportData() {
        const d = localStorage.getItem(currentKey);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([d], {type:"application/json"}));
        a.download = `Data_${currentKey}.json`;
        a.click();
    }
</script>
</body>
</html>
