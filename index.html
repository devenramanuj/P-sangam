<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - Direct Share</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .month-year-container { background: #ffffff; padding: 10px; text-align: center; border-bottom: 2px solid #e67e22; }
        .styled-select { padding: 8px; font-size: 15px; font-weight: bold; color: #000; border: 2px solid #d35400; border-radius: 8px; margin: 5px; width: 120px; }
        .nav-tabs { display: flex; overflow-x: auto; background: white; border-bottom: 2px solid #e67e22; position: sticky; top: 0; z-index: 100; }
        .tab-btn { padding: 12px; border: none; background: none; cursor: pointer; font-weight: bold; color: #555; white-space: nowrap; flex: 1; min-width: 70px; }
        .tab-btn.active { color: #e67e22; background: #fff5eb; border-bottom: 4px solid #e67e22; }
        .container { padding: 15px; }
        .page { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-bottom: 20px; }
        .page.active { display: block; }
        .action-bar { margin-bottom: 15px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; font-size: 12px; display: flex; align-items: center; gap: 5px; }
        .btn-pdf { background: #e74c3c; } .btn-wa { background: #27ae60; } .btn-print { background: #34495e; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 1200px; table-layout: fixed; }
        table, th, td { border: 1px solid #bdc3c7; text-align: center; }
        th { background: #ecf0f1; padding: 8px; }
        input { width: 90%; border: none; padding: 8px; text-align: center; font-size: 13px; color: #000; background: transparent; }
        @media print { .nav-tabs, .action-bar, .month-year-container, .header { display: none !important; } .page { display: block !important; box-shadow: none; border: 1px solid #000; page-break-after: always; } body { background: white; } }
    </style>
</head>
<body onload="initApp()">

<div class="header">પોષણ સંગમ - Direct WhatsApp Share</div>

<div class="month-year-container">
    <select id="selectedMonth" class="styled-select" onchange="changeMonth()">
        <option value="1">જાન્યુઆરી</option><option value="2">ફેબ્રુઆરી</option><option value="3">માર્ચ</option>
        <option value="4">એપ્રિલ</option><option value="5">મે</option><option value="6">જૂન</option>
        <option value="7">જુલાઈ</option><option value="8">ઓગસ્ટ</option><option value="9">સપ્ટેમ્બર</option>
        <option value="10">ઓક્ટોબર</option><option value="11">નવેમ્બર</option><option value="12">ડિસેમ્બર</option>
    </select>
    <select id="selectedYear" class="styled-select" onchange="changeMonth()">
        <option value="2025">2025</option><option value="2026">2026</option>
    </select>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="go(1)">P-1</button><button class="tab-btn" onclick="go(2)">P-2</button><button class="tab-btn" onclick="go(3)">P-3</button><button class="tab-btn" onclick="go(4)">P-4</button><button class="tab-btn" onclick="go(5)">P-5</button><button class="tab-btn" onclick="go(6)">P-6</button><button class="tab-btn" onclick="go(7)">P-7</button>
</div>

<div class="container" id="printable-area">
    <div class="action-bar">
        <button class="btn btn-pdf" onclick="sharePDF()">📄 PDF Share</button>
        <button class="btn btn-wa" onclick="shareDetailedWhatsApp()">💬 WhatsApp Text Share</button>
        <button class="btn btn-print" onclick="window.print()">🖨️ Print All</button>
    </div>

    <div id="p1" class="page active">
        <h3>Page 1: Screening</h3>
        <table>
            <tr><th>ક્રમ</th><th style="width:200px;">બાળકનું નામ</th><th>માતાનું નામ</th><th>જન્મ તારીખ</th><th>સ્તર</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input id="p1_n_${i}" oninput="saveData()"></td><td><input id="p1_m_${i}" oninput="saveData()"></td><td><input type="date" id="p1_d_${i}" oninput="saveData()"></td><td><input id="p1_s_${i}" oninput="saveData()"></td></tr>`);</script>
        </table>
    </div>
    
    </div>

<script>
    let currentKey = "";
    function initApp() { const d = new Date(); document.getElementById('selectedMonth').value = d.getMonth() + 1; document.getElementById('selectedYear').value = d.getFullYear(); changeMonth(); }
    function changeMonth() { currentKey = `poshan_${document.getElementById('selectedMonth').value}_${document.getElementById('selectedYear').value}`; loadData(); }
    function go(n) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active')); document.getElementById('p' + n).classList.add('active'); document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', i+1===n)); window.scrollTo(0,0); }
    function saveData() { const d = {}; document.querySelectorAll('input').forEach(i => { if(i.id) d[i.id] = i.value; }); localStorage.setItem(currentKey, JSON.stringify(d)); }
    function loadData() { document.querySelectorAll('input').forEach(i => i.value = ""); const s = localStorage.getItem(currentKey); if(s){ const d = JSON.parse(s); for(const k in d) if(document.getElementById(k)) document.getElementById(k).value = d[k]; } }

    // ૧. ડાયરેક્ટ PDF શેર કરવાનો પ્રયત્ન (Web Share API)
    async function sharePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const element = document.getElementById('printable-area');
        alert("PDF તૈયાર થઈ રહી છે...");
        
        await html2canvas(element).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            doc.addImage(imgData, 'PNG', 0, 0, 210, 297);
            const pdfBlob = doc.output('blob');
            const file = new File([pdfBlob], "Poshan_Report.pdf", { type: "application/pdf" });

            if (navigator.share) {
                navigator.share({ files: [file], title: 'પોષણ સંગમ', text: 'રિપોર્ટ' })
                .catch(err => { 
                    doc.save("Poshan_Report.pdf"); 
                    alert("સીધું શેર સપોર્ટ નથી એટલે ડાઉનલોડ થયું છે હવે WhatsApp માં ડોક્યુમેન્ટ તરીકે મોકલી દો"); 
                });
            } else {
                doc.save("Poshan_Report.pdf");
                alert("ડાઉનલોડ થઈ ગયું છે હવે WhatsApp પર શેર કરો");
            }
        });
    }

    // ૨. વિગતવાર લખાણ દ્વારા શેર (નામ અને સ્તર સાથે)
    function shareDetailedWhatsApp() {
        let msg = `*પોષણ સંગમ રિપોર્ટ (${document.getElementById('selectedMonth').value}-${document.getElementById('selectedYear').value})*\n\n`;
        let hasData = false;
        for(let i=1; i<=15; i++) {
            let name = document.getElementById(`p1_n_${i}`).value;
            let level = document.getElementById(`p1_s_${i}`).value;
            if(name) {
                msg += `${i}. *નામ:* ${name}\n   *સ્તર:* ${level}\n`;
                hasData = true;
            }
        }
        if(!hasData) return alert("શેર કરવા માટે કોઈ ડેટા નથી");
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`);
    }
</script>
</body>
</html>
