<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - PDF Share</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .action-bar { margin: 15px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; }
        .btn-pdf { background: #e74c3c; } /* લાલ રંગ PDF માટે */
        .btn-wa { background: #27ae60; } /* લીલો રંગ WhatsApp માટે */
        .page { background: white; padding: 20px; margin: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        table, th, td { border: 1px solid #bdc3c7; }
        th { background: #ecf0f1; padding: 10px; }
        input { width: 100%; border: none; padding: 8px; text-align: center; }
        
        @media print {
            .action-bar, .header { display: none !important; }
            .page { box-shadow: none; margin: 0; page-break-after: always; }
        }
    </style>
</head>
<body>

<div class="header">પોષણ સંગમ - PDF શેર સુવિધા</div>

<div class="action-bar">
    <button class="btn btn-pdf" onclick="shareAsPDF()">📄 PDF રિપોર્ટ શેર કરો</button>
    <button class="btn btn-wa" onclick="window.print()">🖨️ PDF સેવ / પ્રિન્ટ</button>
</div>

<div id="capture-area">
    <div class="page">
        <h3>Page 1: Screening Data</h3>
        <table>
            <tr><th>ક્રમ</th><th>બાળકનું નામ</th><th>વજન</th><th>ઊંચાઈ</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input type="text" id="p1_n_${i}"></td><td><input type="text"></td><td><input type="text"></td></tr>`);</script>
        </table>
    </div>
</div>

<script>
    async function shareAsPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const element = document.getElementById('capture-area');

        // પ્રોસેસ ચાલુ છે તેનો મેસેજ
        alert("PDF તૈયાર થઈ રહી છે... થોડી રાહ જુઓ");

        await html2canvas(element, { scale: 2 }).then(canvas => {
            const imgData = canvas.toDataURL('image/png');
            const imgProps = doc.getImageProperties(imgData);
            const pdfWidth = doc.internal.pageSize.getWidth();
            const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
            
            doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
            
            // મોબાઈલ શેર ઓપ્શન ખોલવા માટે
            const pdfBlob = doc.output('blob');
            const file = new File([pdfBlob], "Poshan_Report.pdf", { type: "application/pdf" });

            if (navigator.share) {
                navigator.share({
                    files: [file],
                    title: 'પોષણ સંગમ રિપોર્ટ',
                    text: 'બાળકોના સ્વાસ્થ્યનો અહેવાલ'
                }).then(() => console.log('શેર સફળ'))
                  .catch((error) => console.log('શેર ફેલ', error));
            } else {
                doc.save("Poshan_Report.pdf");
                alert("તમારા મોબાઈલમાં સીધું શેર સપોર્ટ નથી એટલે PDF ડાઉનલોડ થઈ ગઈ છે હવે તેને WhatsApp પર મોકલી દો");
            }
        });
    }
</script>
</body>
</html>
