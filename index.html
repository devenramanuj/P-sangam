<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - ફાઈનલ રજિસ્ટર</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .nav-tabs { display: flex; overflow-x: auto; background: #fff; border-bottom: 2px solid #e67e22; position: sticky; top: 0; z-index: 1000; }
        .tab-btn { padding: 12px 15px; border: none; background: none; cursor: pointer; font-weight: bold; color: #555; white-space: nowrap; flex: 1; }
        .tab-btn.active { color: #e67e22; background: #fff5eb; border-bottom: 4px solid #e67e22; }
        .container { padding: 10px; }
        .page { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; margin-bottom: 20px; }
        .page.active { display: block; }
        .action-bar { margin: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; min-width: 1100px; table-layout: fixed; }
        table, th, td { border: 1px solid #000; text-align: center; padding: 6px; }
        th { background: #ecf0f1; font-weight: bold; }
        input { width: 95%; border: none; padding: 4px; text-align: center; font-size: 12px; background: transparent; outline: none; }
        
        /* ક્રેડિટ લાઈન સ્ટાઈલ */
        .credit-line { 
            text-align: center; 
            margin-top: 15px; 
            font-size: 12px; 
            font-weight: bold; 
            color: #d35400; 
            border-top: 1px dashed #e67e22; 
            padding-top: 5px; 
        }

        @media print {
            @page { size: landscape; margin: 5mm; }
            .nav-tabs, .action-bar, .header { display: none !important; }
            .page { 
                display: block !important; 
                page-break-after: always !important; 
                border: none !important; 
                box-shadow: none !important; 
                margin: 0 !important; 
                padding: 10px 0 !important; 
            }
            .credit-line { display: block !important; position: relative; bottom: 0; color: black !important; border-top: 1px solid #000; }
            table { width: 100% !important; min-width: 100% !important; font-size: 10px !important; }
        }
    </style>
</head>
<body onload="initApp()">

<div class="header">પોષણ સંગમ - આંગણવાડી ડિજિટલ રજિસ્ટર</div>

<div class="action-bar">
    <button class="btn" style="background:#2980b9" onclick="exportData()">📤 Export Backup</button>
    <button class="btn" style="background:#8e44ad" onclick="document.getElementById('fileInput').click()">📥 Import Data</button>
    <input type="file" id="fileInput" style="display:none" onchange="importData(event)">
    <button class="btn" style="background:#d35400" onclick="window.print()">🖨️ પ્રિન્ટ (ક્રેડિટ સાથે)</button>
</div>

<div class="nav-tabs">
    <script>for(let i=1; i<=7; i++) document.write(`<button class="tab-btn ${i==1?'active':''}" onclick="go(${i})">P-${i}</button>`);</script>
</div>

<div class="container" id="allPages">
    <script>
        const headings = [
            "પૃષ્ઠ ૧: Screening data",
            "પૃષ્ઠ ૨: Medical assessment & SNP",
            "પૃષ્ઠ ૩: Medicines during Program",
            "પૃષ્ઠ ૪: Follow up during Program",
            "પૃષ્ઠ ૫: અંતિમ ગ્રેડિંગ",
            "પૃષ્ઠ ૬: ડિસ્ચાર્જના પ્રકાર અને પરિભાષા",
            "પૃષ્ઠ ૭: ડિસ્ચાર્જ પછીનો ફોલોઅપ"
        ];
        for(let p=1; p<=7; p++) {
            document.write(`<div id="page${p}" class="page ${p==1?'active':''}">
                <h3 style="text-align:center;">${headings[p-1]}</h3>
                <div id="tablePlace${p}"></div>
                <div class="credit-line">Developed by: Devendrabhai Ramanuj, 9276505035</div>
            </div>`);
        }
    </script>
</div>

<script>
    function go(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page' + n).classList.add('active');
        document.querySelectorAll('.tab-btn')[n-1].classList.add('active');
    }

    function initApp() {
        const heads = {
            1: "<tr><th>ક્રમ</th><th>બાળકનું નામ</th><th>માતા</th><th>ઉંમર</th><th>જાતિ</th><th>તારીખ</th><th>વજન</th><th>ઊંચાઈ</th><th>સોજા</th><th>સ્તર</th></tr>",
            2: "<tr><th>ભૂખ પરીક્ષણ</th><th>તારીખ</th><th>જટિલતા</th><th>રેફરલ</th><th>વજન</th><th>ઊંચાઈ</th><th>THR</th></tr>",
            3: "<tr><th>ક્રમ</th><th>અઠ ૧</th><th>અઠ ૨</th><th>અઠ ૩</th><th>અઠ ૪</th><th>પખ ૧</th><th>પખ ૨</th></tr>",
            4: "<tr><th>ક્રમ</th><th>વજન ૧</th><th>વજન ૨</th><th>વજન ૩</th><th>વજન ૪</th><th>સ્તર ૧</th><th>સ્તર ૨</th></tr>",
            5: "<tr><th>ક્રમ</th><th>શરૂઆત</th><th>અંતિમ</th><th>સુધારો %</th><th>શેરો</th></tr>",
            6: "<tr><th>રિકવર</th><th>નોન-રિકવર</th><th>જટિલતા</th><th>ફેરબદલ</th><th>ગેરહાજર</th><th>મૃત્યુ</th><th>તપાસ</th></tr>",
            7: "<tr><th>ક્રમ</th><th>૧ માસ</th><th>૨ માસ</th><th>ઊંચાઈ</th><th>સ્થિતિ</th></tr>"
        };

        for(let p=1; p<=7; p++) {
            let html = "<table>" + heads[p];
            for(let i=1; i<=15; i++) {
                html += "<tr>";
                if([1,3,4,5,7].includes(p)) html += `<td>${i}</td>`;
                let count = (p==1)?9:(p==2)?7:(p==6)?7:(p==3)?6:(p==4)?6:(p==5)?4:4;
                for(let c=1; c<=count; c++) html += `<td><input id="p${p}_r${i}_c${c}" oninput="saveData()"></td>`;
                html += "</tr>";
            }
            html += "</table>";
            document.getElementById('tablePlace' + p).innerHTML = html;
        }

        const saved = localStorage.getItem('poshan_final_credit');
        if(saved) {
            const data = JSON.parse(saved);
            for(const k in data) if(document.getElementById(k)) document.getElementById(k).value = data[k];
        }
    }

    function saveData() {
        const d = {};
        document.querySelectorAll('input').forEach(i => { if(i.id) d[i.id] = i.value; });
        localStorage.setItem('poshan_final_credit', JSON.stringify(d));
    }

    function exportData() {
        const d = localStorage.getItem('poshan_final_credit');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([d], {type: "application/json"}));
        a.download = "Poshan_Backup.json";
        a.click();
    }

    function importData(e) {
        const r = new FileReader();
        r.onload = function(ev) { localStorage.setItem('poshan_final_credit', ev.target.result); initApp(); alert("ડેટા લોડ થયો!"); };
        r.readAsText(e.target.files[0]);
    }
</script>
</body>
</html>
