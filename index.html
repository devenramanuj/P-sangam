<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-MAM સ્મૂધ એન્ટ્રી રજીસ્ટર</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        
        body { font-family: 'Hind Gujarati', sans-serif; background-color: #f8fafc; }

        /* મોબાઈલ સ્ક્રોલ માટે ખાસ કન્ટેનર */
        .table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch; /* સ્મૂધ સ્ક્રોલ માટે */
            margin-bottom: 2rem;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        table { border-collapse: separate; border-spacing: 0; min-width: 1200px; } /* ટેબલની પહોળાઈ વધારી */
        
        th, td { border: 1px solid #000; padding: 10px; text-align: center; white-space: nowrap; }

        /* નામની કોલમ ફિક્સ રાખવા માટેનું લોજિક */
        .sticky-col {
            position: sticky;
            left: 0;
            background-color: #f1f5f9 !important;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .sticky-col-2 {
            position: sticky;
            left: 50px; /* ક્રમ પછીનું અંતર */
            background-color: #f1f5f9 !important;
            z-index: 10;
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }

        th { background-color: #1e293b !important; color: white; position: sticky; top: 0; z-index: 20; }
        
        [contenteditable]:focus { background-color: #fffde7; outline: 2px solid #3b82f6; }

        @media print {
            .no-print { display: none !important; }
            .sticky-col, .sticky-col-2 { position: static; box-shadow: none; }
            .table-wrapper { overflow: visible; }
            table { min-width: 100%; width: 100%; table-layout: fixed; }
            th, td { font-size: 10px; padding: 4px; white-space: normal; }
            @page { size: A4 landscape; margin: 5mm; }
        }
    </style>
</head>
<body class="p-2 md:p-4">

    <div class="no-print bg-indigo-900 p-4 text-white flex justify-between items-center rounded-t-lg shadow-lg">
        <div>
            <h1 class="font-bold text-lg">C-MAM રજીસ્ટર (૭ પાના)</h1>
            <p class="text-[10px] text-indigo-200">નામની કોલમ ફિક્સ છે, સાઈડમાં સ્ક્રોલ કરીને એન્ટ્રી કરો</p>
        </div>
        <button onclick="window.print()" class="bg-green-600 px-4 py-1 rounded font-bold shadow">પ્રિન્ટ</button>
    </div>

    <div class="table-wrapper">
        <h2 class="p-3 bg-gray-100 font-bold border-b">પાનું ૧: સ્ક્રિનિંગ ડેટા</h2>
        <table>
            <thead>
                <tr>
                    <th class="sticky-col w-12">ક્રમ</th>
                    <th class="sticky-col-2 w-48">બાળકનું નામ</th>
                    <th class="w-48">માતાનું નામ</th>
                    <th class="w-24">મહિનો</th>
                    <th class="w-20">ઉંમર</th>
                    <th class="w-20">વજન</th>
                    <th class="w-20">ઊંચાઈ</th>
                    <th class="w-20">સોજા?</th>
                </tr>
            </thead>
            <tbody id="p1-body">
                </tbody>
        </table>
    </div>

    <script>
        const totalRows = 17;
        
        function init() {
            const p1 = document.getElementById('p1-body');
            for(let i=1; i<=totalRows; i++) {
                p1.innerHTML += `
                    <tr>
                        <td class="sticky-col font-bold bg-gray-50">${i}</td>
                        <td contenteditable="true" class="sticky-col-2 text-left font-bold px-3"></td>
                        <td contenteditable="true" class="text-left px-3"></td>
                        <td><input type="text" placeholder="MM/YY" class="w-full text-center"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                        <td contenteditable="true"></td>
                    </tr>
                `;
            }
            restoreData();
        }

        // ડેટા સેવ/લોડ લોજિક
        document.addEventListener('input', () => {
            const inputs = Array.from(document.querySelectorAll('[contenteditable], input')).map(el => el.innerText || el.value);
            localStorage.setItem('cmam_v4_data', JSON.stringify(inputs));
        });

        function restoreData() {
            const saved = JSON.parse(localStorage.getItem('cmam_v4_data'));
            if(saved) {
                const elements = document.querySelectorAll('[contenteditable], input');
                elements.forEach((el, i) => {
                    if(el.tagName === 'INPUT') el.value = saved[i] || '';
                    else el.innerText = saved[i] || '';
                });
            }
        }

        init();
    </script>
</body>
</html>
