<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-MAM સંપૂર્ણ રજીસ્ટર</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; background-color: #f0f4f8; }
        .input-box { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-top: 4px; }
        label { font-weight: bold; color: #374151; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 10px; }
        th, td { border: 1px solid black; padding: 4px; text-align: center; font-size: 10px; }
        @media print { 
            .no-print { display: none !important; } 
            .page-break { display: block; page-break-after: always; padding: 10mm; } 
            @page { size: A4 landscape; margin: 0; }
        }
    </style>
</head>
<body class="pb-10">

    <div class="no-print bg-indigo-800 p-4 text-white sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="font-bold text-lg">C-MAM મોબાઈલ ડાયરી</h1>
        <button onclick="window.print()" class="bg-green-600 px-4 py-1 rounded-lg font-bold">PDF પ્રિન્ટ</button>
    </div>

    <div class="no-print p-4 max-w-2xl mx-auto">
        <div class="bg-white p-6 rounded-2xl shadow-xl border-t-8 border-indigo-600">
            <h2 class="text-xl font-bold text-center text-indigo-800 mb-6">૭ પાનાની એન્ટ્રી અહીં કરો</h2>
            
            <div class="mb-6 p-4 bg-indigo-50 rounded-lg">
                <label>કયા ક્રમના બાળકની વિગત ભરવી છે? (૧ થી ૧૭)</label>
                <select id="rowIdx" onchange="loadData()" class="input-box bg-white font-bold text-indigo-700">
                    </select>
            </div>

            <div class="space-y-4 mb-8">
                <h3 class="bg-gray-100 p-2 font-bold rounded">પાનું ૧ અને ૨ (પ્રાથમિક અને મેડિકલ)</h3>
                <div><label>બાળકનું નામ</label><input type="text" id="cName" class="input-box"></div>
                <div><label>માતાનું નામ</label><input type="text" id="mName" class="input-box"></div>
                <div class="flex gap-4">
                    <div class="w-1/2"><label>ઉંમર</label><input type="number" id="cAge" class="input-box"></div>
                    <div class="w-1/2"><label>વજન</label><input type="number" step="0.1" id="cWeight" class="input-box"></div>
                </div>
                <div><label>તબીબી જટિલતાઓ</label><textarea id="cMed" class="input-box" rows="2"></textarea></div>
            </div>

            <div class="space-y-4 mb-8">
                <h3 class="bg-gray-100 p-2 font-bold rounded">પાનું ૪ (અઠવાડિક વજન)</h3>
                <div class="grid grid-cols-2 gap-3">
                    <input type="number" id="w1" placeholder="W1" class="input-box">
                    <input type="number" id="w2" placeholder="W2" class="input-box">
                    <input type="number" id="w3" placeholder="W3" class="input-box">
                    <input type="number" id="w4" placeholder="W4" class="input-box">
                </div>
            </div>

            <button onclick="saveData()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-xl shadow-lg active:scale-95 transition">માહિતી સેવ કરો</button>
        </div>
    </div>

    <div id="printContainer" class="p-4 print:p-0">
        <div class="page-break bg-white p-4">
            <h2 class="text-center font-bold text-lg underline">પાનું ૧: સ્ક્રિનિંગ ડેટા</h2>
            <table id="tbl1"><thead><tr class="bg-gray-100"><th>ક્રમ</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th>ઉંમર</th><th>વજન</th></tr></thead><tbody id="b1"></tbody></table>
        </div>

        <div class="page-break bg-white p-4">
            <h2 class="text-center font-bold text-lg underline">પાનું ૪: અઠવાડિક ફોલો-અપ</h2>
            <table id="tbl4"><thead><tr class="bg-gray-100"><th>ક્રમ</th><th>બાળકનું નામ</th><th>W1</th><th>W2</th><th>W3</th><th>W4</th></tr></thead><tbody id="b4"></tbody></table>
        </div>
        
        </div>

    <script>
        const totalRows = 17;
        let storage = JSON.parse(localStorage.getItem('cmam_complete_v5')) || {};

        function init() {
            const select = document.getElementById('rowIdx');
            const b1 = document.getElementById('b1');
            const b4 = document.getElementById('b4');

            for (let i = 1; i <= totalRows; i++) {
                select.innerHTML += `<option value="${i}">બાળક ક્રમ - ${i}</option>`;
                b1.innerHTML += `<tr id="tr1-${i}"><td>${i}</td><td id="name1-${i}"></td><td id="mname1-${i}"></td><td id="age1-${i}"></td><td id="w1-${i}"></td></tr>`;
                b4.innerHTML += `<tr id="tr4-${i}"><td>${i}</td><td id="name4-${i}"></td><td id="w1-4-${i}"></td><td id="w2-4-${i}"></td><td id="w3-4-${i}"></td><td id="w4-4-${i}"></td></tr>`;
            }
            refreshTable();
            loadData();
        }

        function saveData() {
            const r = document.getElementById('rowIdx').value;
            storage[r] = {
                name: document.getElementById('cName').value,
                mname: document.getElementById('mName').value,
                age: document.getElementById('cAge').value,
                weight: document.getElementById('cWeight').value,
                med: document.getElementById('cMed').value,
                w1: document.getElementById('w1').value,
                w2: document.getElementById('w2').value,
                w3: document.getElementById('w3').value,
                w4: document.getElementById('w4').value
            };
            localStorage.setItem('cmam_complete_v5', JSON.stringify(storage));
            refreshTable();
            alert("માહિતી સેવ થઈ ગઈ!");
        }

        function loadData() {
            const r = document.getElementById('rowIdx').value;
            const d = storage[r] || {};
            document.getElementById('cName').value = d.name || '';
            document.getElementById('mName').value = d.mname || '';
            document.getElementById('cAge').value = d.age || '';
            document.getElementById('cWeight').value = d.weight || '';
            document.getElementById('cMed').value = d.med || '';
            document.getElementById('w1').value = d.w1 || '';
            document.getElementById('w2').value = d.w2 || '';
            document.getElementById('w3').value = d.w3 || '';
            document.getElementById('w4').value = d.w4 || '';
        }

        function refreshTable() {
            for (let i = 1; i <= totalRows; i++) {
                const d = storage[i];
                if (d) {
                    document.getElementById(`name1-${i}`).innerText = d.name;
                    document.getElementById(`mname1-${i}`).innerText = d.mname;
                    document.getElementById(`age1-${i}`).innerText = d.age;
                    document.getElementById(`w1-${i}`).innerText = d.weight;
                    document.getElementById(`name4-${i}`).innerText = d.name;
                    document.getElementById(`w1-4-${i}`).innerText = d.w1;
                    document.getElementById(`w2-4-${i}`).innerText = d.w2;
                    document.getElementById(`w3-4-${i}`).innerText = d.w3;
                    document.getElementById(`w4-4-${i}`).innerText = d.w4;
                }
            }
        }
        init();
    </script>
</body>
</html>
