<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-MAM 7-Page Final Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; background-color: #f3f4f6; }
        
        /* પ્રિન્ટ સેટિંગ્સ - જે ૭ અલગ પાના પાડશે */
        @media print {
            .no-print { display: none !important; }
            .page-break { 
                display: block !important; 
                page-break-after: always !important; 
                margin: 0 !important;
                padding: 10mm !important;
            }
            body { background: white; padding: 0; }
            table { width: 100%; border-collapse: collapse; table-layout: fixed; }
            th, td { border: 1.5px solid black; padding: 5px; font-size: 12px; }
            @page { size: A4 landscape; margin: 0; }
        }

        /* એન્ટ્રી ફોર્મ સ્ટાઈલ */
        .input-card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; border-t-4 border-indigo-600; }
        label { font-weight: bold; color: #1e293b; display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body class="pb-10">

    <div class="no-print bg-indigo-800 p-4 text-white sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="font-bold text-lg">C-MAM ૭ પાનાનું રજીસ્ટર</h1>
        <button onclick="window.print()" class="bg-green-600 px-5 py-2 rounded-lg font-bold shadow-lg active:scale-95 transition">PDF પ્રિન્ટ કરો</button>
    </div>

    <div class="no-print p-4 max-w-3xl mx-auto">
        <div class="input-card">
            <h2 class="text-center text-xl font-bold text-indigo-800 mb-6 border-b pb-2">ડેટા એન્ટ્રી અહીં કરો</h2>
            
            <label>બાળકનો ક્રમ પસંદ કરો (૧ થી ૧૭)</label>
            <select id="childIdx" onchange="loadChildData()" class="bg-blue-50 font-bold">
                </select>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                <div><label>બાળકનું નામ</label><input type="text" id="cName"></div>
                <div><label>માતાનું નામ</label><input type="text" id="mName"></div>
                <div><label>ઉંમર (મહિના)</label><input type="number" id="cAge"></div>
                <div><label>વજન (કિગ્રા)</label><input type="number" step="0.1" id="cWeight"></div>
                <div><label>ઊંચાઈ (સેમી)</label><input type="number" step="0.1" id="cHeight"></div>
                <div><label>મહિનો</label><input type="text" id="cMonth" placeholder="ડિસેમ્બર-2025"></div>
            </div>

            <div class="mt-6 border-t pt-4">
                <h3 class="font-bold text-indigo-700">અઠવાડિક વજન (પાનું ૪)</h3>
                <div class="grid grid-cols-4 gap-2 mt-2">
                    <div><label>W1</label><input type="number" step="0.1" id="w1"></div>
                    <div><label>W2</label><input type="number" step="0.1" id="w2"></div>
                    <div><label>W3</label><input type="number" step="0.1" id="w3"></div>
                    <div><label>W4</label><input type="number" step="0.1" id="w4"></div>
                </div>
            </div>

            <button onclick="saveData()" class="w-full bg-indigo-600 text-white py-4 rounded-xl font-bold text-xl mt-8 shadow-md active:bg-indigo-700 transition">માહિતી સેવ કરો</button>
        </div>
    </div>

    <div id="printArea" class="p-4 print:p-0">
        <div class="page-break bg-white p-4 shadow mb-8">
            <h3 class="text-center font-bold text-lg mb-4 border-b-2 border-black">પાનું ૧: સ્ક્રિનિંગ ડેટા (Screening)</h3>
            <table id="tbl1"><thead><tr><th class="w-12">ક્રમ</th><th class="w-24">મહિનો</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th>ઉંમર</th><th>વજન</th><th>ઊંચાઈ</th></tr></thead><tbody id="b1"></tbody></table>
        </div>

        <div class="page-break bg-white p-4 shadow mb-8">
            <h3 class="text-center font-bold text-lg mb-4 border-b-2 border-black">પાનું ૨: તબીબી મૂલ્યાંકન (Medical)</h3>
            <table id="tbl2"><thead><tr><th class="w-12">ક્રમ</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th>તબીબી વિગત</th></tr></thead><tbody id="b2"></tbody></table>
        </div>

        <div class="page-break bg-white p-4 shadow mb-8">
            <h3 class="text-center font-bold text-lg mb-4 border-b-2 border-black">પાનું ૪: અઠવાડિક ફોલો-અપ</h3>
            <table id="tbl4"><thead><tr><th class="w-12">ક્રમ</th><th>બાળકનું નામ</th><th>W1</th><th>W2</th><th>W3</th><th>W4</th><th>W5</th><th>W6</th></tr></thead><tbody id="b4"></tbody></table>
        </div>
        
        </div>

    <script>
        const total = 17;
        let db = JSON.parse(localStorage.getItem('cmam_final_v7')) || {};

        function setup() {
            const sel = document.getElementById('childIdx');
            const b1 = document.getElementById('b1');
            const b2 = document.getElementById('b2');
            const b4 = document.getElementById('b4');

            for (let i = 1; i <= total; i++) {
                sel.innerHTML += `<option value="${i}">ક્રમ - ${i}</option>`;
                b1.innerHTML += `<tr><td>${i}</td><td id="m1-${i}"></td><td id="n1-${i}"></td><td id="mn1-${i}"></td><td id="a1-${i}"></td><td id="w1-${i}"></td><td id="h1-${i}"></td></tr>`;
                b2.innerHTML += `<tr><td>${i}</td><td id="n2-${i}"></td><td id="mn2-${i}"></td><td></td></tr>`;
                b4.innerHTML += `<tr><td>${i}</td><td id="n4-${i}"></td><td id="ww1-${i}"></td><td id="ww2-${i}"></td><td id="ww3-${i}"></td><td id="ww4-${i}"></td><td></td><td></td></tr>`;
            }
            refreshView();
            loadChildData();
        }

        function saveData() {
            const i = document.getElementById('childIdx').value;
            db[i] = {
                name: document.getElementById('cName').value,
                mname: document.getElementById('mName').value,
                age: document.getElementById('cAge').value,
                weight: document.getElementById('cWeight').value,
                height: document.getElementById('cHeight').value,
                month: document.getElementById('cMonth').value,
                w1: document.getElementById('w1').value,
                w2: document.getElementById('w2').value,
                w3: document.getElementById('w3').value,
                w4: document.getElementById('w4').value
            };
            localStorage.setItem('cmam_final_v7', JSON.stringify(db));
            refreshView();
            alert("ડેટા સેવ થયો!");
        }

        function loadChildData() {
            const i = document.getElementById('childIdx').value;
            const d = db[i] || {};
            document.getElementById('cName').value = d.name || '';
            document.getElementById('mName').value = d.mname || '';
            document.getElementById('cAge').value = d.age || '';
            document.getElementById('cWeight').value = d.weight || '';
            document.getElementById('cHeight').value = d.height || '';
            document.getElementById('cMonth').value = d.month || '';
            document.getElementById('w1').value = d.w1 || '';
            document.getElementById('w2').value = d.w2 || '';
            document.getElementById('w3').value = d.w3 || '';
            document.getElementById('w4').value = d.w4 || '';
        }

        function refreshView() {
            for (let i = 1; i <= total; i++) {
                const d = db[i];
                if (d) {
                    document.getElementById(`m1-${i}`).innerText = d.month;
                    document.getElementById(`n1-${i}`).innerText = d.name;
                    document.getElementById(`mn1-${i}`).innerText = d.mname;
                    document.getElementById(`a1-${i}`).innerText = d.age;
                    document.getElementById(`w1-${i}`).innerText = d.weight;
                    document.getElementById(`h1-${i}`).innerText = d.height;
                    document.getElementById(`n2-${i}`).innerText = d.name;
                    document.getElementById(`mn2-${i}`).innerText = d.mname;
                    document.getElementById(`n4-${i}`).innerText = d.name;
                    document.getElementById(`ww1-${i}`).innerText = d.w1;
                    document.getElementById(`ww2-${i}`).innerText = d.w2;
                    document.getElementById(`ww3-${i}`).innerText = d.w3;
                    document.getElementById(`ww4-${i}`).innerText = d.w4;
                }
            }
        }
        setup();
    </script>
</body>
</html>
