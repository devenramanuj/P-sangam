<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-MAM 7-Page Separate Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; }
        .tab-btn.active { background-color: #1e3a8a; color: white; border-bottom: 4px solid #fbbf24; }
        .page-section { display: none; }
        .page-section.active { display: block; }
        @media print { .no-print { display: none !important; } .page-break { page-break-after: always; display: block; } @page { size: A4 landscape; margin: 5mm; } }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td { border: 1px solid black; padding: 4px; text-align: center; font-size: 10px; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <div class="no-print bg-indigo-900 p-4 text-white sticky top-0 z-50 flex justify-between items-center shadow-lg">
        <h1 class="font-bold">C-MAM ૭ પાનાની અલગ એન્ટ્રી</h1>
        <div class="flex gap-2">
            <button onclick="exportData()" class="bg-blue-600 px-3 py-1 rounded text-xs">Export</button>
            <button onclick="window.print()" class="bg-green-600 px-3 py-1 rounded text-xs font-bold">Print</button>
        </div>
    </div>

    <div class="no-print p-4 max-w-4xl mx-auto">
        <div class="bg-white rounded-xl shadow-2xl p-4 border-t-8 border-indigo-700">
            <div class="mb-4 bg-yellow-50 p-3 rounded-lg border border-yellow-200">
                <label class="font-bold text-sm">બાળકનો ક્રમ (૧-૧૭):</label>
                <select id="childIdx" onchange="loadCurrentData()" class="w-full p-2 border rounded font-bold mt-1">
                    </select>
            </div>

            <div class="flex overflow-x-auto gap-1 mb-6 border-b pb-2">
                <button onclick="showTab(1)" id="t1" class="tab-btn active px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૧ સ્ક્રિનિંગ</button>
                <button onclick="showTab(2)" id="t2" class="tab-btn px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૨ મેડિકલ</button>
                <button onclick="showTab(3)" id="t3" class="tab-btn px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૩ SNP/દૂધ</button>
                <button onclick="showTab(4)" id="t4" class="tab-btn px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૪ ફોલો-અપ</button>
                <button onclick="showTab(5)" id="t5" class="tab-btn px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૫ દવાઓ</button>
                <button onclick="showTab(6)" id="t6" class="tab-btn px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૬ ડિસ્ચાર્જ</button>
                <button onclick="showTab(7)" id="t7" class="tab-btn px-4 py-2 rounded-t-lg text-xs whitespace-nowrap">૭ પોસ્ટ</button>
            </div>

            <div id="form-container">
                <div id="sec1" class="page-section active space-y-3">
                    <input type="text" id="p1_name" placeholder="બાળકનું નામ" class="w-full p-2 border rounded">
                    <input type="text" id="p1_mname" placeholder="માતાનું નામ" class="w-full p-2 border rounded">
                    <input type="number" id="p1_age" placeholder="ઉંમર" class="w-full p-2 border rounded">
                </div>
                <div id="sec2" class="page-section space-y-3">
                    <select id="p2_app" class="w-full p-2 border rounded"><option>ભૂખ: પાસ</option><option>ભૂખ: નાપાસ</option></select>
                    <textarea id="p2_comp" placeholder="તબીબી જટિલતાઓ" class="w-full p-2 border rounded"></textarea>
                </div>
                <div id="sec4" class="page-section space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" id="p4_w1" placeholder="W1 વજન" class="w-full p-2 border rounded">
                        <input type="number" id="p4_w2" placeholder="W2 વજન" class="w-full p-2 border rounded">
                    </div>
                </div>
            </div>

            <button onclick="saveCurrentData()" class="w-full bg-indigo-800 text-white py-3 rounded-lg font-bold mt-6 shadow-lg active:scale-95 transition">માહિતી સેવ કરો</button>
        </div>
    </div>

    <div id="printArea" class="p-4 print:p-0">
        <div class="page-break bg-white p-4 mb-4 border border-black"><h3 class="font-bold text-center underline">પાનું ૧</h3><table id="tbl1"><thead><tr><th>ક્રમ</th><th>નામ</th><th>માતા</th><th>ઉંમર</th></tr></thead><tbody id="b1"></tbody></table></div>
        <div class="page-break bg-white p-4 mb-4 border border-black"><h3 class="font-bold text-center underline">પાનું ૪</h3><table id="tbl4"><thead><tr><th>ક્રમ</th><th>નામ</th><th>W1</th><th>W2</th></tr></thead><tbody id="b4"></tbody></table></div>
    </div>

    <script>
        const total = 17;
        let db = JSON.parse(localStorage.getItem('cmam_v10')) || {};

        function init() {
            const sel = document.getElementById('childIdx');
            for(let i=1; i<=total; i++) {
                sel.innerHTML += `<option value="${i}">બાળક ક્રમ - ${i}</option>`;
                document.getElementById('b1').innerHTML += `<tr><td>${i}</td><td id="n1-${i}"></td><td id="m1-${i}"></td><td id="a1-${i}"></td></tr>`;
                document.getElementById('b4').innerHTML += `<tr><td>${i}</td><td id="n4-${i}"></td><td id="w1-${i}"></td><td id="w2-${i}"></td></tr>`;
            }
            showTab(1);
            loadCurrentData();
            refreshTable();
        }

        function showTab(n) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`sec${n}`)?.classList.add('active');
            document.getElementById(`t${n}`)?.classList.add('active');
        }

        function saveCurrentData() {
            const i = document.getElementById('childIdx').value;
            db[i] = db[i] || {};
            db[i].name = document.getElementById('p1_name').value;
            db[i].mname = document.getElementById('p1_mname').value;
            db[i].age = document.getElementById('p1_age').value;
            db[i].w1 = document.getElementById('p4_w1').value;
            db[i].w2 = document.getElementById('p4_w2').value;
            localStorage.setItem('cmam_v10', JSON.stringify(db));
            refreshTable();
            alert("સેવ થયું");
        }

        function loadCurrentData() {
            const i = document.getElementById('childIdx').value;
            const d = db[i] || {};
            document.getElementById('p1_name').value = d.name || '';
            document.getElementById('p1_mname').value = d.mname || '';
            document.getElementById('p1_age').value = d.age || '';
            document.getElementById('p4_w1').value = d.w1 || '';
            document.getElementById('p4_w2').value = d.w2 || '';
        }

        function refreshTable() {
            for(let i=1; i<=total; i++) {
                const d = db[i]; if(!d) continue;
                document.getElementById(`n1-${i}`).innerText = d.name;
                document.getElementById(`m1-${i}`).innerText = d.mname;
                document.getElementById(`a1-${i}`).innerText = d.age;
                document.getElementById(`n4-${i}`).innerText = d.name;
                document.getElementById(`w1-${i}`).innerText = d.w1;
                document.getElementById(`w2-${i}`).innerText = d.w2;
            }
        }
        init();
    </script>
</body>
</html>
