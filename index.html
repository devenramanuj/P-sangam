<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>માસિક પોષણ રજીસ્ટર</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #000; padding: 4px; text-align: center; }
        @media print { 
            .no-print { display: none; } 
            body { padding: 0; background: white; }
            table { font-size: 10px; } /* પ્રિન્ટમાં અક્ષરો નાના જેથી વધુ સમાય */
        }
    </style>
</head>
<body class="bg-gray-100 p-4">

<div class="max-w-7xl mx-auto bg-white p-4 shadow-lg">
    <div class="flex justify-between items-center mb-4 no-print bg-blue-600 p-4 text-white rounded">
        <div class="flex items-center gap-4">
            <label class="font-bold">મહિનો પસંદ કરો:</label>
            <select id="monthSelect" onchange="renderTable()" class="text-black p-1 rounded">
                <option value="0">જાન્યુઆરી</option><option value="1">ફેબ્રુઆરી</option>
                <option value="2">માર્ચ</option><option value="3">એપ્રિલ</option>
                <option value="4">મે</option><option value="5">જૂન</option>
                <option value="6">જુલાઈ</option><option value="7">ઓગસ્ટ</option>
                <option value="8">સપ્ટેમ્બર</option><option value="9">ઓક્ટોબર</option>
                <option value="10">નવેમ્બર</option><option value="11" selected>ડિસેમ્બર</option>
            </select>
            <select id="yearSelect" onchange="renderTable()" class="text-black p-1 rounded">
                <option>2024</option><option selected>2025</option><option>2026</option>
            </select>
        </div>
        <div class="flex gap-2">
            <button onclick="window.print()" class="bg-white text-blue-600 px-4 py-1 rounded font-bold">PDF પ્રિન્ટ</button>
            <button onclick="showAddModal()" class="bg-green-500 text-white px-4 py-1 rounded font-bold">+ નવું બાળક</button>
        </div>
    </div>

    <h2 class="text-center font-bold text-lg mb-2">બાળ પોષણ અને તબીબી મૂલ્યાંકન રજીસ્ટર (માસિક)</h2>
    <table id="registerTable">
        <thead>
            <tr class="bg-gray-200">
                <th rowspan="2">ક્રમ</th>
                <th rowspan="2">બાળકનું નામ / માતાનું નામ</th>
                <th colspan="3">પ્રાથમિક માપન (Page 1)</th>
                <th colspan="2">તબીબી (Page 2)</th>
                <th colspan="4">અઠવાડિક વજન (Page 4)</th>
                <th rowspan="2">પરિણામ</th>
            </tr>
            <tr class="bg-gray-100">
                <th>ઉંમર</th><th>વજન</th><th>ઊંચાઈ</th>
                <th>ભૂખ</th><th>જટિલતા</th>
                <th>W1</th><th>W2</th><th>W3</th><th>W4</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
    <p class="mt-4 text-gray-500 no-print">* જે મહિનામાં બાળક ન હોય તે રો (Row) ખાલી દેખાશે અથવા તમે પ્રિન્ટ વખતે કાઢી શકશો</p>
</div>

<div id="addModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center no-print">
    <div class="bg-white p-6 rounded-lg w-full max-w-md">
        <h3 class="font-bold mb-4">બાળકની વિગત ઉમેરો</h3>
        <input type="text" id="cName" placeholder="બાળકનું નામ" class="w-full border p-2 mb-2">
        <input type="number" id="cAge" placeholder="ઉંમર (મહિના)" class="w-full border p-2 mb-2">
        <input type="number" id="cWeight" placeholder="વજન (કિગ્રા)" class="w-full border p-2 mb-2">
        <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="p-2 text-gray-500">રદ કરો</button>
            <button onclick="saveChild()" class="p-2 bg-blue-600 text-white rounded">સેવ કરો</button>
        </div>
    </div>
</div>

<script>
    let children = JSON.parse(localStorage.getItem('cmam_v2')) || [];

    function renderTable() {
        const m = document.getElementById('monthSelect').value;
        const y = document.getElementById('yearSelect').value;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        // ફિલ્ટર કરેલ ડેટા
        let filtered = children.filter(c => c.month == m && c.year == y);

        // ૧૭ રો (Row) પૂરી કરવા માટે લૂપ
        for (let i = 0; i < 17; i++) {
            let c = filtered[i] || { name: '', age: '', weight: '', height: '', appetite: '', comp: '', w1: '', w2: '', w3: '', w4: '', status: '' };
            tbody.innerHTML += `
                <tr class="${c.name ? '' : 'text-transparent'}">
                    <td>${i + 1}</td>
                    <td class="text-left">${c.name}</td>
                    <td>${c.age}</td>
                    <td>${c.weight}</td>
                    <td>${c.height}</td>
                    <td>${c.appetite}</td>
                    <td>${c.comp}</td>
                    <td>${c.w1}</td><td>${c.w2}</td><td>${c.w3}</td><td>${c.w4}</td>
                    <td>${c.status}</td>
                </tr>
            `;
        }
    }

    function showAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('addModal').classList.add('hidden'); }

    function saveChild() {
        const name = document.getElementById('cName').value;
        const month = document.getElementById('monthSelect').value;
        const year = document.getElementById('yearSelect').value;
        
        children.push({ name: name, month: month, year: year, age: document.getElementById('cAge').value, weight: document.getElementById('cWeight').value });
        localStorage.setItem('cmam_v2', JSON.stringify(children));
        closeModal();
        renderTable();
    }

    renderTable();
</script>
</body>
</html>
