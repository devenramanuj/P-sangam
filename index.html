<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <title>પોષણ સંગમ - ફાઇનલ ડેટા સેફ રજીસ્ટર</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .config-bar { background: #fff; padding: 15px; border-bottom: 2px solid #e67e22; display: flex; justify-content: center; gap: 10px; padding-bottom: 5px; }
        .nav-tabs { display: flex; background: #fff; border-bottom: 2px solid #e67e22; overflow-x: auto; }
        .tab-btn { padding: 12px 20px; border: none; background: none; cursor: pointer; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { color: #e67e22; border-bottom: 4px solid #e67e22; background: #fff5eb; }
        .page { display: none; background: white; padding: 20px; margin: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .page.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; table-layout: fixed; }
        table, th, td { border: 1px solid #000; text-align: center; padding: 5px; }
        th { background: #ecf0f1; }
        input, select { width: 96%; border: none; padding: 5px; text-align: center; background: transparent; }
        .credit { text-align: center; font-weight: bold; margin-top: 20px; border-top: 1px solid #000; padding-top: 10px; font-size: 12px; }
        @media print { .no-print { display: none !important; } .page { display: block !important; page-break-after: always !important; } }
    </style>
</head>
<body onload="initApp()">

<div class="header no-print">પોષણ સંગમ - આંગણવાડી રજીસ્ટર 2025</div>

<div class="config-bar no-print">
    <input type="text" id="newChildName" placeholder="બાળકનું નામ" style="border:1px solid #ccc; padding:5px; border-radius:4px;">
    <button onclick="addNewChild()" style="background:#27ae60; color:white; border:none; padding:7px 15px; border-radius:4px; cursor:pointer;">➕ ઉમેરો</button>
    <select id="childSelector" onchange="loadChildData()" style="padding:5px; width:150px; border:1px solid #d35400;"></select>
    <button onclick="window.print()" style="background:#d35400; color:white; border:none; padding:7px 15px; border-radius:4px; cursor:pointer;">🖨️ પ્રિન્ટ</button>
</div>

<div class="nav-tabs no-print">
    <button class="tab-btn active" onclick="showPage(1)">P-1</button>
    <button class="tab-btn" onclick="showPage(2)">P-2</button>
    <button class="tab-btn" onclick="showPage(3)">P-3</button>
    <button class="tab-btn" onclick="showPage(4)">P-4</button>
    <button class="tab-btn" onclick="showPage(5)">P-5</button>
    <button class="tab-btn" onclick="showPage(6)">P-6</button>
    <button class="tab-btn" onclick="showPage(7)">P-7</button>
</div>

<div id="content"></div>

<script>
    let children = JSON.parse(localStorage.getItem('poshan_list_v3') || "[]");
    const creditText = "Developed by- Devendra ramanuj, 9276505035";

    function initApp() {
        renderTables();
        updateList();
        const last = localStorage.getItem('poshan_last_child');
        if (last) {
            document.getElementById('childSelector').value = last;
            loadChildData();
        }
    }

    function renderTables() {
        let html = "";
        const m = ["","જાન્યુઆરી","ફેબ્રુઆરી","માર્ચ","એપ્રિલ","મે","જૂન","જુલાઈ","ઓગસ્ટ","સપ્ટેમ્બર","ઓક્ટોબર","નવેમ્બર","ડિસેમ્બર"];
        
        // P-1
        html += `<div id="page1" class="page active"><h3 align="center">P-1: Screening</h3><table><tr><th>માસ</th><th>નામ</th><th>માતા</th><th>જન્મ તારીખ</th><th>તારીખ</th><th>વજન</th><th>ઊંચાઈ</th><th>સ્તર</th></tr>`;
        for(let r=1; r<=10; r++) {
            html += `<tr><td><select id="p1_r${r}_m" onchange="saveData()"><option value=""></option>${m.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></td><td><input id="p1_r${r}_name" oninput="saveData()"></td><td><input id="p1_r${r}_mom" oninput="saveData()"></td><td><input id="p1_r${r}_dob" oninput="saveData()"></td><td><input id="p1_r${r}_dt" oninput="saveData()"></td><td><input id="p1_r${r}_w" oninput="saveData()"></td><td><input id="p1_r${r}_h" oninput="saveData()"></td><td><select id="p1_r${r}_lv" onchange="saveData()"><option value=""></option><option value="SAM">SAM</option><option value="MAM">MAM</option></select></td></tr>`;
        }
        html += `</table><div class="credit">${creditText}</div></div>`;

        // P2 to P7
        for(let p=2; p<=7; p++) {
            html += `<div id="page${p}" class="page"><h3 align="center">P-${p}</h3><table><tr><th>નામ</th><th>વિગત ૧</th><th>વિગત ૨</th><th>વિગત ૩</th><th>વિગત ૪</th><th>તારીખ</th></tr>`;
            for(let r=1; r<=10; r++) {
                html += `<tr><td><input id="p${p}_r${r}_name" oninput="saveData()"></td><td><input id="p${p}_r${r}_c1" oninput="saveData()"></td><td><input id="p${p}_r${r}_c2" oninput="saveData()"></td><td><input id="p${p}_r${r}_c3" oninput="saveData()"></td><td><input id="p${p}_r${r}_c4" oninput="saveData()"></td><td><input id="p${p}_r${r}_dt" oninput="saveData()"></td></tr>`;
            }
            html += `</table><div class="credit">${creditText}</div></div>`;
        }
        document.getElementById('content').innerHTML = html;
    }

    function addNewChild() {
        const n = document.getElementById('newChildName').value.trim();
        if(!n || children.includes(n)) return;
        children.push(n);
        localStorage.setItem('poshan_list_v3', JSON.stringify(children));
        updateList();
        document.getElementById('childSelector').value = n;
        loadChildData();
    }

    function updateList() {
        document.getElementById('childSelector').innerHTML = children.map(x => `<option value="${x}">${x}</option>`).join('');
    }

    function showPage(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page' + n).classList.add('active');
        document.querySelectorAll('.tab-btn')[n-1].classList.add('active');
    }

    function saveData() {
        const c = document.getElementById('childSelector').value;
        if(!c) return;
        localStorage.setItem('poshan_last_child', c);
        const data = {};
        document.querySelectorAll('input, select').forEach(el => { if(el.id) data[el.id] = el.value; });
        localStorage.setItem('poshan_v3_data_' + c, JSON.stringify(data));
    }

    function loadChildData() {
        const c = document.getElementById('childSelector').value;
        if(!c) return;
        localStorage.setItem('poshan_last_child', c);
        document.querySelectorAll('input, select').forEach(el => el.value = "");
        const saved = JSON.parse(localStorage.getItem('poshan_v3_data_' + c) || "{}");
        for(let k in saved) { if(document.getElementById(k)) document.getElementById(k).value = saved[k]; }
    }
</script>
</body>
</html>
