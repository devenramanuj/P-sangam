<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - એડવાન્સ રજિસ્ટર</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .nav-tabs { display: flex; overflow-x: auto; background: white; border-bottom: 2px solid #e67e22; position: sticky; top: 0; z-index: 100; }
        .tab-btn { padding: 12px; border: none; background: none; cursor: pointer; font-weight: bold; color: #555; white-space: nowrap; flex: 1; min-width: 70px; }
        .tab-btn.active { color: #e67e22; background: #fff5eb; border-bottom: 4px solid #e67e22; }
        .container { padding: 15px; }
        .page { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; }
        .page.active { display: block; }
        .month-selector { background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .action-bar { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; }
        .btn { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: white; font-size: 11px; }
        .btn-print { background: #34495e; }
        .btn-export { background: #27ae60; }
        .btn-import { background: #2980b9; }
        .btn-clear { background: #e74c3c; }
        table { width: 100%; border-collapse: collapse; font-size: 10px; min-width: 1400px; table-layout: fixed; }
        table, th, td { border: 1px solid #bdc3c7; }
        th { background: #ecf0f1; padding: 5px; }
        .col-name { width: 180px; }
        input, select { width: 100%; border: none; padding: 8px; text-align: center; font-size: 12px; background: transparent; }
        input:focus { background: #fff9f0; outline: 1px solid #e67e22; }
        @media print { .nav-tabs, .action-bar, .month-selector { display: none !important; } .page { display: block !important; page-break-after: always; border: 1px solid #000; } }
    </style>
</head>
<body onload="initApp()">

<div class="header">પોષણ સંગમ - એડવાન્સ ડિજિટલ રજિસ્ટર</div>

<div class="month-selector">
    <label>માસ પસંદ કરો:</label>
    <select id="selectedMonth" style="width: 120px; background: #fff; border: 1px solid #ddd;" onchange="changeMonth()">
        <option value="1">જાન્યુઆરી</option><option value="2">ફેબ્રુઆરી</option><option value="3">માર્ચ</option>
        <option value="4">એપ્રિલ</option><option value="5">મે</option><option value="6">જૂન</option>
        <option value="7">જુલાઈ</option><option value="8">ઓગસ્ટ</option><option value="9">સપ્ટેમ્બર</option>
        <option value="10">ઓક્ટોબર</option><option value="11">નવેમ્બર</option><option value="12">ડિસેમ્બર</option>
    </select>
    <select id="selectedYear" style="width: 100px; background: #fff; border: 1px solid #ddd;" onchange="changeMonth()">
        <option value="2025">2025</option><option value="2026">2026</option>
    </select>
</div>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="go(1)">P-1</button>
    <button class="tab-btn" onclick="go(2)">P-2</button>
    <button class="tab-btn" onclick="go(3)">P-3</button>
    <button class="tab-btn" onclick="go(4)">P-4</button>
    <button class="tab-btn" onclick="go(5)">P-5</button>
    <button class="tab-btn" onclick="go(6)">P-6</button>
    <button class="tab-btn" onclick="go(7)">P-7</button>
</div>

<div class="container">
    <div class="action-bar">
        <button class="btn btn-print" onclick="window.print()">🖨️ પ્રિન્ટ</button>
        <button class="btn btn-export" onclick="exportData()">📤 Export Excel</button>
        <button class="btn btn-import" onclick="document.getElementById('importFile').click()">📥 Import</button>
        <input type="file" id="importFile" style="display:none" onchange="importData(event)">
        <button class="btn btn-clear" onclick="clearMonthData()">⚠️ આ માસનો ડેટા ડિલીટ</button>
    </div>

    <div id="p1" class="page active">
        <h3>Page 1: Screening Data</h3>
        <table>
            <colgroup><col style="width:40px;"><col class="col-name"><col class="col-name"><col span="7"></colgroup>
            <tr><th>ક્રમ</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th>જન્મ તારીખ</th><th>ઉંમર</th><th>જાતિ</th><th>તારીખ</th><th>વજન</th><th>ઊંચાઈ</th><th>સ્તર</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input type="text" id="p1_a_${i}" oninput="saveData()"></td><td><input type="text" id="p1_b_${i}" oninput="saveData()"></td><td><input type="date" id="p1_c_${i}" oninput="saveData()"></td><td><input type="number" id="p1_d_${i}" oninput="saveData()"></td><td><select id="p1_e_${i}" onchange="saveData()"><option value="">-</option><option>કુમાર</option><option>કન્યા</option></select></td><td><input type="date" id="p1_f_${i}" oninput="saveData()"></td><td><input type="text" id="p1_g_${i}" oninput="saveData()"></td><td><input type="text" id="p1_h_${i}" oninput="saveData()"></td><td><input type="text" id="p1_i_${i}" oninput="saveData()"></td></tr>`);</script>
        </table>
    </div>

    <div id="p2" class="page">
        <h3>Page 2: Assessment & SNP</h3>
        <table>
            <tr><th>ક્રમ</th><th>ભૂખ પરીક્ષણ</th><th>તારીખ</th><th>જટિલતા</th><th>રેફરલ</th><th>દાખલ</th><th>THR</th><th>સંખ્યા</th><th>દૂધ</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><select id="p2_a_${i}" onchange="saveData()"><option value="">-</option><option>પાસ</option><option>નપાસ</option></select></td><td><input type="date" id="p2_b_${i}" oninput="saveData()"></td><td><input type="text" id="p2_c_${i}" oninput="saveData()"></td><td><input type="text" id="p2_d_${i}" oninput="saveData()"></td><td><input type="date" id="p2_e_${i}" oninput="saveData()"></td><td><select id="p2_f_${i}" onchange="saveData()"><option value="">-</option><option>હા</option><option>ના</option></select></td><td><input type="text" id="p2_g_${i}" oninput="saveData()"></td><td><select id="p2_h_${i}" onchange="saveData()"><option value="">-</option><option>હા</option><option>ના</option></select></td></tr>`);</script>
        </table>
    </div>

    <div id="p7" class="page">
        <h3>Page 7: Post Discharge</h3>
        <table>
            <tr><th>ક્રમ</th><th>તારીખ</th><th>સ્થિતિ</th><th>દાખલ</th><th>રજા</th><th>ગ્રેડ</th><th>વજન</th><th>ઊંચાઈ</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input type="date" id="p7_a_${i}" oninput="saveData()"></td><td><input type="text" id="p7_b_${i}" oninput="saveData()"></td><td><input type="date" id="p7_c_${i}" oninput="saveData()"></td><td><input type="date" id="p7_d_${i}" oninput="saveData()"></td><td><input type="text" id="p7_e_${i}" oninput="saveData()"></td><td><input type="text" id="p7_f_${i}" oninput="saveData()"></td><td><input type="text" id="p7_g_${i}" oninput="saveData()"></td></tr>`);</script>
        </table>
    </div>
</div>

<script>
    let currentKey = "";

    function initApp() {
        const d = new Date();
        document.getElementById('selectedMonth').value = d.getMonth() + 1;
        document.getElementById('selectedYear').value = d.getFullYear();
        changeMonth();
    }

    function changeMonth() {
        const m = document.getElementById('selectedMonth').value;
        const y = document.getElementById('selectedYear').value;
        currentKey = `poshan_data_${m}_${y}`;
        loadData();
    }

    function go(n) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('p' + (document.getElementById('p'+n) ? n : 1)).classList.add('active');
        document.querySelectorAll('.tab-btn')[n-1].classList.add('active');
        window.scrollTo(0,0);
    }

    function saveData() {
        const inputs = document.querySelectorAll('input, select');
        const data = {};
        inputs.forEach(input => { if (input.id) data[input.id] = input.value; });
        localStorage.setItem(currentKey, JSON.stringify(data));
    }

    function loadData() {
        document.querySelectorAll('input, select').forEach(input => { if(input.id) input.value = ""; });
        const savedData = localStorage.getItem(currentKey);
        if (savedData) {
            const data = JSON.parse(savedData);
            for (const id in data) {
                const element = document.getElementById(id);
                if (element) element.value = data[id];
            }
        }
    }

    function exportData() {
        const data = localStorage.getItem(currentKey);
        if(!data) return alert("આ માસમાં કોઈ ડેટા નથી");
        const blob = new Blob([data], {type: "application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Poshan_Data_${currentKey}.json`;
        a.click();
    }

    function importData(event) {
        const reader = new FileReader();
        reader.onload = function() {
            localStorage.setItem(currentKey, reader.result);
            loadData();
            alert("ડેટા સફળતાપૂર્વક ઈમ્પોર્ટ થઈ ગયો છે");
        };
        reader.readAsText(event.target.files[0]);
    }

    function clearMonthData() {
        if(confirm("શું તમે આ માસનો ડેટા ભૂંસી નાખવા માંગો છો?")) {
            localStorage.removeItem(currentKey);
            loadData();
        }
    }
</script>
</body>
</html>
