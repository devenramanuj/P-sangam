<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C-MAM કાયમી રજીસ્ટર</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; background-color: #f3f4f6; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="p-2 md:p-6">

<div class="max-w-6xl mx-auto bg-white shadow-2xl rounded-2xl overflow-hidden border border-gray-200">
    <div class="bg-gradient-to-r from-blue-700 to-indigo-800 p-6 text-white flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">C-MAM ડિજિટલ ડાયરી</h1>
            <p class="text-blue-100 text-sm">ડેટા ઓટોમેટિક સેવ થાય છે</p>
        </div>
        <div class="flex gap-3 no-print">
            <button onclick="window.print()" class="bg-white text-blue-800 p-2 rounded-lg shadow font-bold">PDF/Print</button>
            <button onclick="shareWhatsApp()" class="bg-green-500 text-white p-2 rounded-lg shadow font-bold">WhatsApp</button>
        </div>
    </div>

    <div class="p-4 bg-gray-50 flex flex-wrap justify-between items-center gap-4 no-print border-b">
        <div class="flex items-center gap-4">
            <button onclick="changeMonth(-1)" class="bg-blue-100 p-2 rounded">← પાછળ</button>
            <span id="currentDateDisplay" class="font-bold text-lg text-blue-900">ડિસેમ્બર 2025</span>
            <button onclick="changeMonth(1)" class="bg-blue-100 p-2 rounded">આગળ →</button>
        </div>
        <div class="flex gap-2">
            <button onclick="exportJSON()" class="text-xs bg-gray-200 p-2 rounded">Backup (Export)</button>
            <label class="text-xs bg-gray-200 p-2 rounded cursor-pointer">Restore (Import) <input type="file" onchange="importJSON(event)" class="hidden"></label>
        </div>
    </div>

    <div class="p-6 bg-blue-50 no-print border-b">
        <h3 class="font-bold mb-4 text-blue-800">નવી એન્ટ્રી ઉમેરો:</h3>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <input type="text" id="newName" placeholder="બાળકનું નામ" class="p-2 border rounded">
            <input type="number" id="newWeight" placeholder="વજન (kg)" class="p-2 border rounded">
            <input type="number" id="newHeight" placeholder="ઊંચાઈ (cm)" class="p-2 border rounded">
            <button onclick="addEntry()" class="bg-blue-600 text-white p-2 rounded font-bold hover:bg-blue-700">સેવ કરો</button>
        </div>
    </div>

    <div class="p-4 overflow-x-auto">
        <table class="w-full border-collapse border border-gray-300">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border p-2">ક્રમ</th>
                    <th class="border p-2 text-left">બાળકનું નામ</th>
                    <th class="border p-2 text-center">વજન</th>
                    <th class="border p-2 text-center">ઊંચાઈ</th>
                    <th class="border p-2 text-center">માસ/વર્ષ</th>
                    <th class="border p-2 no-print">એક્શન</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<script>
    // LocalStorage માંથી ડેટા લોડ કરવો (જો ન હોય તો ખાલી એરે [])
    let masterData = JSON.parse(localStorage.getItem('cmam_secure_records')) || [];
    let d = new Date();
    let currM = d.getMonth();
    let currY = d.getFullYear();

    const monthNames = ["જાન્યુઆરી", "ફેબ્રુઆરી", "માર્ચ", "એપ્રિલ", "મે", "જૂન", "જુલાઈ", "ઓગસ્ટ", "સપ્ટેમ્બર", "ઓક્ટોબર", "નવેમ્બર", "ડિસેમ્બર"];

    function updateView() {
        document.getElementById('currentDateDisplay').innerText = `${monthNames[currM]} ${currY}`;
        renderData();
    }

    function addEntry() {
        const name = document.getElementById('newName').value;
        const weight = document.getElementById('newWeight').value;
        const height = document.getElementById('newHeight').value;

        if(!name) { alert("નામ લખવું જરૂરી છે"); return; }

        const entry = {
            id: Date.now(),
            name: name,
            weight: weight,
            height: height,
            month: currM,
            year: currY
        };

        masterData.push(entry);
        saveToStorage();
        renderData();

        // ફોર્મ ખાલી કરો
        document.getElementById('newName').value = '';
        document.getElementById('newWeight').value = '';
        document.getElementById('newHeight').value = '';
    }

    function saveToStorage() {
        // આ લાઈન ડેટાને કાયમી મેમરીમાં સેવ કરે છે
        localStorage.setItem('cmam_secure_records', JSON.stringify(masterData));
    }

    function renderData() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        // માત્ર વર્તમાન મહિના અને વર્ષનો જ ડેટા બતાવો
        const filtered = masterData.filter(i => i.month === currM && i.year === currY);

        filtered.forEach((item, index) => {
            tbody.innerHTML += `
                <tr class="hover:bg-gray-50">
                    <td class="border p-2 text-center">${index + 1}</td>
                    <td class="border p-2 font-bold text-blue-900">${item.name}</td>
                    <td class="border p-2 text-center">${item.weight} kg</td>
                    <td class="border p-2 text-center">${item.height} cm</td>
                    <td class="border p-2 text-center text-xs text-gray-500">${monthNames[item.month]} ${item.year}</td>
                    <td class="border p-2 text-center no-print">
                        <button onclick="deleteEntry(${item.id})" class="text-red-500 font-bold">ડિલીટ</button>
                    </td>
                </tr>
            `;
        });
    }

    function deleteEntry(id) {
        if(confirm("શું તમે આ એન્ટ્રી કાઢી નાખવા માંગો છો?")) {
            masterData = masterData.filter(i => i.id !== id);
            saveToStorage();
            renderData();
        }
    }

    function changeMonth(step) {
        currM += step;
        if (currM > 11) { currM = 0; currY++; }
        if (currM < 0) { currM = 11; currY--; }
        updateView();
    }

    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(masterData));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `CMAM_Backup_${currY}.json`);
        dlAnchor.click();
    }

    function importJSON(event) {
        const reader = new FileReader();
        reader.onload = (e) => {
            masterData = JSON.parse(e.target.result);
            saveToStorage();
            renderData();
        };
        reader.readAsText(event.target.files[0]);
    }

    function shareWhatsApp() {
        let text = `*C-MAM રિપોર્ટ - ${monthNames[currM]} ${currY}*\n\n`;
        const filtered = masterData.filter(i => i.month === currM && i.year === currY);
        filtered.forEach((item, i) => {
            text += `${i+1}. ${item.name} | વજન: ${item.weight}kg | ઊંચાઈ: ${item.height}cm\n`;
        });
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
    }

    // પેજ લોડ થાય ત્યારે ડેટા બતાવો
    updateView();
</script>

</body>
</html>
