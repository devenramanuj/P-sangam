<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - ઓટો ગણતરી</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { padding: 15px; }
        .page { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1000px; }
        table, th, td { border: 1px solid #bdc3c7; text-align: center; padding: 8px; }
        th { background: #ecf0f1; }
        input { width: 90%; border: none; padding: 5px; text-align: center; background: transparent; font-size: 13px; }
        input:focus { outline: 1px solid #e67e22; background: #fff; }
        .auto-calc { color: #d35400; font-weight: bold; }
    </style>
</head>
<body onload="initApp()">

<div class="header">પોષણ સંગમ - માસિક ગણતરી રજિસ્ટર</div>

<div class="container">
    <div class="page">
        <h3>માસિક વજન અને ઊંચાઈ વૃદ્ધિ પત્રક</h3>
        <table>
            <tr>
                <th>ક્રમ</th>
                <th>બાળકનું નામ</th>
                <th>શરૂઆતનું વજન (kg)</th>
                <th>શરૂઆતની ઊંચાઈ (cm)</th>
                <th>૧ માસ પછી વજન (Auto/Manual)</th>
                <th>૧ માસ પછી ઊંચાઈ (Auto/Manual)</th>
            </tr>
            <script>
                for(let i=1; i<=15; i++) {
                    document.write(`
                        <tr>
                            <td>${i}</td>
                            <td><input type="text" id="name_${i}" oninput="saveData()"></td>
                            <td><input type="number" id="init_w_${i}" step="0.1" oninput="doCalc(${i}); saveData()"></td>
                            <td><input type="number" id="init_h_${i}" step="0.1" oninput="doCalc(${i}); saveData()"></td>
                            <td><input type="number" id="next_w_${i}" step="0.1" class="auto-calc" oninput="saveData()"></td>
                            <td><input type="number" id="next_h_${i}" step="0.1" class="auto-calc" oninput="saveData()"></td>
                        </tr>
                    `);
                }
            </script>
        </table>
    </div>
</div>

<script>
    function doCalc(row) {
        const initW = parseFloat(document.getElementById(`init_w_${row}`).value);
        const initH = parseFloat(document.getElementById(`init_h_${row}`).value);
        
        // વજનમાં સરેરાશ ૪૦૦ ગ્રામ (0.4 kg) વધારો
        if (initW > 0) {
            const nextW = initW + 0.4;
            document.getElementById(`next_w_${row}`).value = nextW.toFixed(2);
        }
        
        // ઊંચાઈમાં સરેરાશ ૦.૫ cm વધારો
        if (initH > 0) {
            const nextH = initH + 0.5;
            document.getElementById(`next_h_${row}`).value = nextH.toFixed(1);
        }
    }

    function saveData() {
        const data = {};
        document.querySelectorAll('input').forEach(i => { if(i.id) data[i.id] = i.value; });
        localStorage.setItem('poshan_calc_data', JSON.stringify(data));
    }

    function initApp() {
        const saved = localStorage.getItem('poshan_calc_data');
        if (saved) {
            const data = JSON.parse(saved);
            for (const key in data) {
                const el = document.getElementById(key);
                if (el) el.value = data[key];
            }
        }
    }
</script>
</body>
</html>
