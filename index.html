<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>પોષણ સંગમ - Direct Share</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fcf3e8; margin: 0; padding: 0; }
        .header { background: #e67e22; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .action-bar { margin: 15px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; color: white; font-size: 13px; display: flex; align-items: center; gap: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .btn-direct { background: #25D366; } /* WhatsApp ગ્રીન */
        .btn-export { background: #2980b9; }
        .btn-import { background: #8e44ad; }
        .page { background: white; padding: 20px; margin: 15px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 600px; }
        table, th, td { border: 1px solid #bdc3c7; text-align: center; padding: 8px; }
        th { background: #ecf0f1; }
        input { width: 95%; border: none; text-align: center; background: transparent; }
    </style>
</head>
<body onload="initApp()">

<div class="header">પોષણ સંગમ - Direct WhatsApp Share</div>

<div class="action-bar">
    <button class="btn btn-direct" onclick="directWhatsAppPDF()">📲 PDF Direct Share</button>
    <button class="btn btn-export" onclick="exportData()">📤 Export</button>
    <button class="btn btn-import" onclick="document.getElementById('importFile').click()">📥 Import</button>
    <input type="file" id="importFile" style="display:none" onchange="importData(event)">
</div>

<div id="capture-area">
    <div class="page">
        <h2 style="text-align:center; color:#e67e22;">પોષણ સંગમ રિપોર્ટ</h2>
        <table>
            <tr><th>ક્રમ</th><th>બાળકનું નામ</th><th>માતાનું નામ</th><th>સ્તર</th></tr>
            <script>for(let i=1; i<=15; i++) document.write(`<tr><td>${i}</td><td><input id="p1_n_${i}" oninput="saveData()"></td><td><input id="p1_m_${i}" oninput="saveData()"></td><td><input id="p1_s_${i}" oninput="saveData()"></td></tr>`);</script>
        </table>
    </div>
</div>

<script>
    let currentKey = "poshan_current";
    function initApp() { loadData(); }
    function saveData() { const d = {}; document.querySelectorAll('input').forEach(i => { if(i.id) d[i.id] = i.value; }); localStorage.setItem(currentKey, JSON.stringify(d)); }
    function loadData() { const s = localStorage.getItem(currentKey); if(s){ const d = JSON.parse(s); for(const k in d) if(document.getElementById(k)) document.getElementById(k).value = d[k]; } }

    async function directWhatsAppPDF() {
        const { jsPDF } = window.jspdf;
        const element = document.getElementById('capture-area');
        
        try {
            const canvas = await html2canvas(element, { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            const doc = new jsPDF('p', 'mm', 'a4');
            doc.addImage(imgData, 'PNG', 10, 10, 190, 0);
            
            const pdfBlob = doc.output('blob');
            const file = new File([pdfBlob], "Poshan_Report.pdf", { type: "application/pdf" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({
                    files: [file],
                    title: 'પોષણ સંગમ રિપોર્ટ',
                    text: 'બાળકોની સ્વાસ્થ્ય વિગત'
                });
            } else {
                doc.save("Poshan_Report.pdf");
                alert("તમારો ફોન ડાયરેક્ટ ફાઈલ શેર સપોર્ટ નથી કરતો એટલે PDF સેવ થઈ છે હવે મેન્યુઅલી મોકલી દો");
            }
        } catch (error) {
            alert("ભૂલ આવી: " + error);
        }
    }

    function exportData() { /* અગાઉ મુજબ */ }
    function importData(e) { /* અગાઉ મુજબ */ }
</script>
</body>
</html>
