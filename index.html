<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>મોબાઈલ ફ્રેન્ડલી C-MAM રજીસ્ટર</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Gujarati:wght@400;700&display=swap');
        body { font-family: 'Hind Gujarati', sans-serif; }
        .tab-btn.active { border-bottom: 3px solid #4f46e5; color: #4f46e5; font-weight: bold; }
        @media print { .no-print { display: none !important; } .page-break { page-break-after: always; display: block; } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <div class="no-print bg-indigo-700 p-4 text-white sticky top-0 z-50 shadow-md">
        <div class="flex justify-between items-center">
            <h1 class="text-lg font-bold">C-MAM ડિજિટલ રજીસ્ટર</h1>
            <button onclick="window.print()" class="bg-white text-indigo-700 px-3 py-1 rounded text-sm font-bold">પ્રિન્ટ</button>
        </div>
    </div>

    <div class="no-print p-4">
        <div class="bg-white rounded-xl shadow-lg p-5 border-t-4 border-indigo-600">
            <h2 class="font-bold text-indigo-800 mb-4 text-center border-b pb-2">નવી એન્ટ્રી / એડિટ</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700">ક્રમ સિલેક્ટ કરો (૧ થી ૧૭)</label>
                    <select id="rowSelect" onchange="loadRowData()" class="w-full p-2 border rounded-lg bg-blue-50">
                        </select>
                </div>
                
                <div class="grid grid-cols-1 gap-3">
                    <input type="text" id="cName" placeholder="બાળકનું નામ" class="w-full p-3 border rounded-lg focus:ring-2 ring-indigo-200">
                    <input type="text" id="mName" placeholder="માતાનું નામ" class="w-full p-3 border rounded-lg focus:ring-2 ring-indigo-200">
                    <div class="flex gap-2">
                        <input type="number" id="cAge" placeholder="ઉંમર" class="w-1/2 p-3 border rounded-lg">
                        <input type="number" id="cWeight" placeholder="વજન" class="w-1/2 p-3 border rounded-lg">
                    </div>
                </div>

                <button onclick="saveCurrentRow()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg hover:bg-indigo-700 active:scale-95 transition">માહિતી સેવ કરો</button>
            </div>
        </div>
    </div>

    <div class="mt-10 p-4 overflow-x-auto print:p-0">
        <h3 class="text-center font-bold text-gray-500 mb-4 no-print">રિપોર્ટ પ્રિવ્યુ (નીચે જુઓ)</h3>
        
        <div class="page-break bg-white p-4 mb-10 border border-black shadow-sm">
            <h2 class="text-center font-bold text-lg mb-4 border-b border-black">પાનું ૧: સ્ક્રિનિંગ ડેટા</h2>
            <table class="w-full border-collapse border border-black text-[10px] md:text-sm">
                <thead>
                    <tr class="bg-gray-100">
                        <th class="border border-black p-1">ક્રમ</th>
                        <th class="border border-black p-1">બાળકનું નામ</th>
                        <th class="border border-black p-1">માતાનું નામ</th>
                        <th class="border border-black p-1">ઉંમર</th>
                        <th class="border border-black p-1">વજન</th>
                        <th class="border border-black p-1">ઊંચાઈ</th>
                    </tr>
                </thead>
                <tbody id="print-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        const totalRows = 17;
        let masterData = JSON.parse(localStorage.getItem('cmam_final_data')) || {};

        function init() {
            const select = document.getElementById('rowSelect');
            const tbody = document.getElementById('print-body');
            
            for(let i=1; i<=totalRows; i++) {
                // Dropdown options
                let opt = document.createElement('option');
                opt.value = i;
                opt.innerText = `બાળક ક્રમ - ${i}`;
                select.appendChild(opt);

                // Table Rows
                tbody.innerHTML += `
                    <tr id="row-${i}">
                        <td class="border border-black p-1 text-center">${i}</td>
                        <td class="border border-black p-1" id="td-name-${i}"></td>
                        <td class="border border-black p-1" id="td-mname-${i}"></td>
                        <td class="border border-black p-1 text-center" id="td-age-${i}"></td>
                        <td class="border border-black p-1 text-center" id="td-weight-${i}"></td>
                        <td class="border border-black p-1 text-center" id="td-height-${i}"></td>
                    </tr>
                `;
            }
            loadTableFromData();
            loadRowData();
        }

        function saveCurrentRow() {
            const r = document.getElementById('rowSelect').value;
            masterData[r] = {
                name: document.getElementById('cName').value,
                mname: document.getElementById('mName').value,
                age: document.getElementById('cAge').value,
                weight: document.getElementById('cWeight').value
            };
            localStorage.setItem('cmam_final_data', JSON.stringify(masterData));
            loadTableFromData();
            alert("ક્રમ " + r + " ની માહિતી સેવ થઈ ગઈ છે");
        }

        function loadRowData() {
            const r = document.getElementById('rowSelect').value;
            const d = masterData[r] || {name:'', mname:'', age:'', weight:''};
            document.getElementById('cName').value = d.name;
            document.getElementById('mName').value = d.mname;
            document.getElementById('cAge').value = d.age;
            document.getElementById('cWeight').value = d.weight;
        }

        function loadTableFromData() {
            for(let i=1; i<=totalRows; i++) {
                const d = masterData[i];
                if(d) {
                    document.getElementById(`td-name-${i}`).innerText = d.name;
                    document.getElementById(`td-mname-${i}`).innerText = d.mname;
                    document.getElementById(`td-age-${i}`).innerText = d.age;
                    document.getElementById(`td-weight-${i}`).innerText = d.weight;
                }
            }
        }

        init();
    </script>
</body>
</html>
